spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  onboarding:
    verification-base-url: http://localhost:8080/api/v1/public/onboarding/verify-web
    local-login-enabled: false
    notification:
      email-enabled: false
  security:
    jwt:
      issuer: silverleaf-test
      secret: test-secret-test-secret-test-secret-123456
      access-token-minutes: 15
      refresh-token-days: 30
