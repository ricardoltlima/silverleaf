<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Silverleaf Reserve</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #eef3ec 0%, #f8faf7 100%);
            color: #1f2937;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .shell {
            text-align: center;
            padding: 24px;
        }

        .shell img {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: block;
            margin: 0 auto 16px;
        }

        .shell a {
            color: #2f6b45;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="shell">
    <img src="/silverleaf-icon.svg" alt="Silverleaf Reserve">
    <p>Redirecting to Silverleaf Reserve...</p>
    <p><a href="/app/login">Open login</a></p>
</div>
<script>
    const hasToken = !!localStorage.getItem("silverleaf_access_token");
    window.location.replace(hasToken ? "/app/community" : "/app/login");
</script>
</body>
</html>
