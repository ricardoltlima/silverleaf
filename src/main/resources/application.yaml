spring:
  application:
    name: silverleaf-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/silverleaf}
    username: ${DB_USERNAME:silverleaf}
    password: ${DB_PASSWORD:silverleaf}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-message: never

logging:
  level:
    org.springframework.security: INFO
    com.hoa.silverleaf: INFO

app:
  feed:
    upload-dir: ${FEED_UPLOAD_DIR:uploads}
  security:
    jwt:
      issuer: silverleaf
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
      access-token-minutes: 15
      refresh-token-days: 30
